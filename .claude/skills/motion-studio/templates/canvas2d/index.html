<!doctype html>
<html><head><meta charset="utf-8"><title>motion-studio: canvas2d scene</title>
<style>
/* Fonts: copy .woff2 files into ./fonts and declare them here, then list them in FONTS below.
@font-face{font-family:Display;src:url(fonts/Display.woff2) format('woff2');font-weight:300 700} */
html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}
</style></head>
<body><canvas id="c"></canvas>
<script>
// =====================================================================================
// motion-studio canvas2d template - 2D motion graphics and cinematic type.
// Contract: every frame is a pure function of time t, so renders are deterministic.
// Edit CONFIG, BRAND and SCENES; leave the engine section alone unless needed.
// =====================================================================================
const Q = new URLSearchParams(location.search);
const CONFIG = {
  W: 1920, H: 1080,            // logical canvas; output scale via ?s=2 for 4K
  FPS: 30, DUR: 8,             // seconds
  SUB: 4, SHUTTER: .5,         // motion-blur sub-frames per frame and shutter (fraction of a frame)
  LETTERBOX: 0,                // 0 = none, 2.39 = cinematic bars
  GRAIN: .05, VIGNETTE: .35, BLOOM: 0,   // post: film grain, vignette strength, glow on bright pixels (0..1)
};
const BRAND = {                // neutral placeholders - replace with the brand kit named in Brain/Firm.md
  bg: '#101114', fg: '#F2F0EA', accent: '#E0B04A', muted: 'rgba(242,240,234,.6)',
  display: '600 {px}px system-ui, sans-serif', text: '400 {px}px system-ui, sans-serif', mono: '500 {px}px ui-monospace, monospace',
};
const FONTS = [];              // e.g. ['40px Display'] - awaited before window.ready

// ---------------- engine: helpers ----------------
const S = +(Q.get('s') || 1), { W, H, FPS, DUR } = CONFIG, CX = W / 2, CY = H / 2, TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: t => t, outCubic: t => 1 - Math.pow(1 - t, 3), inCubic: t => t * t * t, inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t), inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outQuint: t => 1 - Math.pow(1 - t, 5), outBack: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const font = (kind, px) => BRAND[kind].replace('{px}', px);
// text rising through a mask; segs = [[text, colour?], ...] so one word can take the accent
function riseText(ctx, segs, x, y, px, p, { kind = 'display', align = 'left', col = BRAND.fg } = {}) {
  if (p <= 0) return; if (typeof segs === 'string') segs = [[segs]];
  ctx.font = font(kind, px); ctx.textBaseline = 'alphabetic';
  const ws = segs.map(([s]) => ctx.measureText(s).width), tot = ws.reduce((a, b) => a + b, 0);
  let sx = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
  ctx.save(); ctx.beginPath(); ctx.rect(sx - 10, y - px * 1.05, tot + 20, px * 1.35); ctx.clip();
  const dy = (1 - E.outQuint(clamp(p))) * px * 1.2;
  segs.forEach(([s, c], i) => { ctx.fillStyle = c || col; ctx.textAlign = 'left'; ctx.fillText(s, sx, y + dy); sx += ws[i]; });
  ctx.restore();
}
function typeOn(ctx, str, x, y, px, p, { col = BRAND.accent, align = 'left', track = 2 } = {}) {
  if (p <= 0) return; ctx.font = font('mono', px); ctx.fillStyle = col; ctx.textBaseline = 'alphabetic';
  const s = str.slice(0, Math.ceil(str.length * clamp(p))), ch = [...s], w = ch.map(c => ctx.measureText(c).width);
  const tot = w.reduce((a, b) => a + b, 0) + track * (ch.length - 1); let px2 = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
  ctx.textAlign = 'left'; ch.forEach((c, i) => { ctx.fillText(c, px2, y); px2 += w[i] + track; });
}
function hairline(ctx, x1, y1, x2, y2, p, col = BRAND.accent, w = 1.5) { if (p <= 0) return; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, p), lerp(y1, y2, p)); ctx.stroke(); }
const fadeOut = (t, t1, d = .5) => 1 - E.inCubic(prog(t, t1 - d, t1));

// ---------------- SCENES: [start, drawFn, transitionIn, transitionSeconds] ----------------
// transitionIn: 'cut' | 'dissolve' | 'wipe' (a vertical accent line sweeps across). Scenes draw their own background.
function sceneTitle(ctx, t) {
  ctx.fillStyle = BRAND.bg; ctx.fillRect(0, 0, W, H);
  const a = fadeOut(t, 4.0); ctx.globalAlpha = a;
  hairline(ctx, CX - 320, CY + 170, CX + 320, CY + 170, E.inOutCubic(prog(t, .2, 1.2)), BRAND.accent, 2);
  typeOn(ctx, 'MOTION-STUDIO / TEMPLATE', CX, CY - 150, 18, prog(t, .9, 1.7), { align: 'center' });
  riseText(ctx, 'Every frame is a function', CX, CY - 10, 96, prog(t, 1.1, 2.1), { align: 'center' });
  riseText(ctx, [['of '], ['time.', BRAND.accent]], CX, CY + 100, 96, prog(t, 1.3, 2.3), { align: 'center' });
  ctx.globalAlpha = 1;
}
function sceneNumbers(ctx, t) {
  const u = t - 4.0;
  ctx.fillStyle = BRAND.bg; ctx.fillRect(0, 0, W, H);
  const stats = [['300', '+', 'Example figure'], ['10', '+', 'Another figure'], ['2000', '', 'A year']];
  const cw = (W - 320) / stats.length;
  stats.forEach(([n, suf, cap], i) => {
    const x = 160 + i * cw, p = E.outCubic(prog(u, .3 + i * .12, 1.3 + i * .12));
    hairline(ctx, x, 380, x, 640, E.outCubic(prog(u, .2 + i * .1, 1 + i * .1)), BRAND.accent, 1.2);
    const count = /^\d+$/.test(n) && n.length < 4 ? Math.round(+n * E.outCubic(prog(u, .4 + i * .12, 1.8 + i * .12))) : n;
    riseText(ctx, [[String(count) + (p >= 1 ? suf : '')]], x + 36, 560, 150, p);
    typeOn(ctx, cap.toUpperCase(), x + 38, 620, 16, prog(u, .9 + i * .12, 1.6 + i * .12));
  });
  if (t > DUR - .6) { ctx.fillStyle = `rgba(0,0,0,${prog(t, DUR - .6, DUR)})`; ctx.fillRect(0, 0, W, H); } // end on black
}
const SCENES = [[0, sceneTitle, 'cut', 0], [4.0, sceneNumbers, 'wipe', .7]];
// sound cues for scripts/score_example.py (times in seconds)
window.cues = () => ({ duration: DUR, reveals: [1.1, 2.3, 4.3, 4.42, 4.54], hits: [[4.0, .6]] });

// ---------------- engine: timeline, motion blur, post ----------------
const cv = document.getElementById('c'); cv.width = W * S; cv.height = H * S; const out = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W * S; c.height = H * S; return c; };
const A = mk(), actx = A.getContext('2d'), B1 = mk(), b1 = B1.getContext('2d'), B2 = mk(), b2 = B2.getContext('2d');
const bloomC = document.createElement('canvas'); bloomC.width = W / 4; bloomC.height = H / 4; const bctx = bloomC.getContext('2d');
let grain = null;
function paint(ctx, fn, t) { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; fn(ctx, t); }
function frameAt(t) {
  let i = 0; SCENES.forEach((s, k) => { if (t >= s[0]) i = k; });
  const [t0, fn, kind, d] = SCENES[i], k = t - t0;
  paint(b1, fn, t);
  if (i > 0 && k < d && kind !== 'cut') {
    paint(b2, SCENES[i - 1][1], t); b2.setTransform(1, 0, 0, 1, 0, 0);
    if (kind === 'dissolve') { b2.globalAlpha = E.inOutCubic(k / d); b2.drawImage(B1, 0, 0); b2.globalAlpha = 1; }
    else { const x = lerp(0, W * S, E.inOutExpo(k / d)); b2.save(); b2.beginPath(); b2.rect(0, 0, x, H * S); b2.clip(); b2.drawImage(B1, 0, 0); b2.restore(); b2.fillStyle = BRAND.accent; b2.fillRect(x - 2 * S, 0, 3 * S, H * S); }
    return B2;
  }
  return B1;
}
function renderFrame(f) {
  const t0 = f / FPS;
  for (let s = 0; s < CONFIG.SUB; s++) { const t = clamp(t0 + (s / CONFIG.SUB - .5) * CONFIG.SHUTTER / FPS, 0, DUR - 1e-4); const src = frameAt(t); actx.globalAlpha = 1 / (s + 1); actx.drawImage(src, 0, 0); }
  actx.globalAlpha = 1; out.setTransform(1, 0, 0, 1, 0, 0); out.globalCompositeOperation = 'source-over'; out.drawImage(A, 0, 0);
  if (CONFIG.BLOOM > 0) { bctx.filter = 'brightness(0.9) contrast(2.4) blur(6px)'; bctx.clearRect(0, 0, W / 4, H / 4); bctx.drawImage(A, 0, 0, W / 4, H / 4); bctx.filter = 'none';
    out.globalCompositeOperation = 'screen'; out.globalAlpha = CONFIG.BLOOM; out.drawImage(bloomC, 0, 0, W * S, H * S); out.globalAlpha = 1; out.globalCompositeOperation = 'source-over'; }
  if (CONFIG.GRAIN > 0) { out.globalCompositeOperation = 'overlay'; out.globalAlpha = CONFIG.GRAIN; out.drawImage(grain, (f * 37) % 11 - 11, (f * 53) % 7 - 7, W * S + 22, H * S + 14); out.globalAlpha = 1; out.globalCompositeOperation = 'source-over'; }
  if (CONFIG.VIGNETTE > 0) { const g = out.createRadialGradient(CX * S, CY * S, H * .4 * S, CX * S, CY * S, H * 1.05 * S); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${CONFIG.VIGNETTE})`); out.fillStyle = g; out.fillRect(0, 0, W * S, H * S); }
  if (CONFIG.LETTERBOX) { const bar = Math.round((H - W / CONFIG.LETTERBOX) / 2) * S; out.fillStyle = '#000'; out.fillRect(0, 0, W * S, bar); out.fillRect(0, H * S - bar, W * S, bar); }
}
window.META = { fps: FPS, frames: Math.round(DUR * FPS) };
window.grab = f => { renderFrame(f); return cv.toDataURL('image/jpeg', .94); };
(async () => {
  await Promise.all(FONTS.map(f => document.fonts.load(f)));
  grain = document.createElement('canvas'); grain.width = W; grain.height = H; const g = grain.getContext('2d'), id = g.createImageData(W, H), r = rng(11);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - .5) * 230; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0);
  window.ready = true;
  if (!navigator.webdriver) { const st = performance.now(); (function loop() { renderFrame(Math.floor(((performance.now() - st) / 1000 % DUR) * FPS)); requestAnimationFrame(loop); })(); }
})();
</script></body></html>
